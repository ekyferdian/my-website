backend:
  name: github
  repo: ekyferdian/my-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Artikel"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "Judul"
        name: "title"
        widget: "string"

      - label: "Deskripsi SEO"
        name: "description"
        widget: "text"

      - label: "Tanggal"
        name: "date"
        widget: "datetime"

      - label: "Gambar Thumbnail"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "Konten Artikel"
        name: "body"
        widget: "markdown"

  - name: "pages"
    label: "Halaman"
    label_singular: "Halaman"
    files:
      - label: "Beranda"
        name: "home"
        file: "content/pages/index.json"
        fields:
          - {label: "Judul Halaman", name: "title", widget: "string"}
          - {label: "Deskripsi SEO", name: "description", widget: "text"}
          - {label: "Judul Hero", name: "hero_title", widget: "string"}
          - {label: "Deskripsi Hero", name: "hero_text", widget: "text"}
          - {label: "Teks Tombol CTA", name: "hero_cta_text", widget: "string", required: false}
          - {label: "Link Tombol CTA", name: "hero_cta_link", widget: "string", required: false}
          - {label: "Isi Halaman", name: "page_body", widget: "markdown"}
      - label: "Artikel"
        name: "article"
        file: "content/pages/article.json"
        fields:
          - {label: "Judul Halaman", name: "title", widget: "string"}
          - {label: "Deskripsi SEO", name: "description", widget: "text"}
          - {label: "Judul Hero", name: "hero_title", widget: "string"}
          - {label: "Deskripsi Hero", name: "hero_text", widget: "text"}
          - {label: "Isi Halaman", name: "page_body", widget: "markdown"}
      - label: "Panduan"
        name: "guide"
        file: "content/pages/guide.json"
        fields:
          - {label: "Judul Halaman", name: "title", widget: "string"}
          - {label: "Deskripsi SEO", name: "description", widget: "text"}
          - {label: "Judul Hero", name: "hero_title", widget: "string"}
          - {label: "Deskripsi Hero", name: "hero_text", widget: "text"}
          - {label: "Isi Halaman", name: "page_body", widget: "markdown"}
      - label: "FAQ"
        name: "faq"
        file: "content/pages/faq.json"
        fields:
          - {label: "Judul Halaman", name: "title", widget: "string"}
          - {label: "Deskripsi SEO", name: "description", widget: "text"}
          - {label: "Judul Hero", name: "hero_title", widget: "string"}
          - {label: "Deskripsi Hero", name: "hero_text", widget: "text"}
          - {label: "Isi Halaman", name: "page_body", widget: "markdown"}
      - label: "Daftar Artikel"
        name: "article_index"
        file: "content/articles/index.json"
        fields:
          - label: "Artikel"
            name: "articles"
            widget: "list"
            fields:
              - {label: "Judul", name: "title", widget: "string"}
              - {label: "Ringkasan", name: "summary", widget: "text"}
              - {label: "Tautan", name: "url", widget: "string"}
