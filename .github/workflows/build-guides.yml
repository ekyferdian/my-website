name: Build Guides Index

on:
  push:
    paths:
      - 'content/guides/**'
      - 'scripts/build_guide_index.py'

jobs:
  build-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Build guides index
        run: |
          python scripts/build_guide_index.py

      - name: Commit generated guides.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/pages/guides.json
          git commit -m "chore: build guides index [skip ci]" || echo "No changes to commit"
          git push
