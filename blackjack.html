<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blackjack - GameVerse ID</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="navbar">
  <div class="container nav-wrap">
    <div class="logo">GameVerse ID</div>
  </div>
</header>

<section class="hero hero-small">
  <div class="container">
    <h1>Blackjack</h1>
    <p>Permainan kartu dengan target 21.</p>
  </div>
</section>

<section class="section">
<div class="container">

  <div class="card premium-card">
    <h2>Pengenalan</h2>
    <p>Blackjack adalah permainan kartu untuk mencapai nilai 21 tanpa melebihi.</p>
  </div>

  <div class="card premium-card">
    <h2>Aturan Dasar</h2>
    <ul>
      <li>Kartu angka sesuai nilai</li>
      <li>Kartu wajah bernilai 10</li>
      <li>As bisa 1 atau 11</li>
    </ul>
  </div>

  <div class="card premium-card">
    <h2>Istilah</h2>
    <p>Hit, Stand, Split, Double Down</p>
  </div>

</div>
</section>

</body>
</html>
